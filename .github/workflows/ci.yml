name: CI

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "fix/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit and component tests
        run: bun run test

      - name: Production build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          LOVABLE_API_KEY: ci-placeholder-ai-key
          PADDLE_API_KEY: ci-placeholder-paddle-key
          PADDLE_CLIENT_TOKEN: ci-placeholder-paddle-client-token
          PADDLE_WEBHOOK_SECRET: ci-placeholder-paddle-webhook-secret
